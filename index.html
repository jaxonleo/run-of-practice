<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Run of Practice" />
    <meta name="theme-color" content="#1b4332" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Run of Practice</title>
    <!-- Portrait-only lock, pure CSS. The manifest's "orientation":"portrait"
         above covers an installed Android/Chrome PWA. This overlay was
         originally meant as the iOS fallback (Safari has never implemented
         the manifest orientation member or the Screen Orientation lock API),
         but direct feedback from a live test was that a full-screen black
         "rotate back" block is worse than the thing it's blocking -- on iOS
         specifically it replaces an awkward-but-still-usable landscape layout
         with a dead screen. Rolled back to iOS only: the overlay still covers
         Android/other touch devices (where it's a genuine improvement over
         nothing), but is explicitly forced off on iOS via the standard
         CSS-only "-webkit-touch-callout" feature-detection trick, which only
         WebKit -- and therefore only iOS's browsers, since Apple requires
         every iOS browser to use WebKit -- recognizes as a supported
         property. Android Chrome/Firefox don't support it and fall through
         to the normal rule above. -->
    <style>
      #rop-rotate-lock{display:none;position:fixed;inset:0;z-index:999999;background:#081c11;color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
      #rop-rotate-lock svg{width:56px;height:56px;margin-bottom:16px;animation:rop-rotate-hint 1.6s ease-in-out infinite;}
      #rop-rotate-lock h1{font-size:20px;font-weight:700;margin:0 0 8px;}
      #rop-rotate-lock p{font-size:15px;color:#b7c9be;margin:0;max-width:280px;}
      @keyframes rop-rotate-hint{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-90deg);}}
      @media (orientation:landscape) and (pointer:coarse){
        #rop-rotate-lock{display:flex;}
      }
      @supports (-webkit-touch-callout:none){
        @media (orientation:landscape) and (pointer:coarse){
          #rop-rotate-lock{display:none!important;}
        }
      }
    </style>
  </head>
  <body>
    <div id="rop-rotate-lock" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/></svg>
      <h1>Rotate back to portrait</h1>
      <p>Run of Practice is designed for portrait use only. Turn your device back upright to continue.</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
